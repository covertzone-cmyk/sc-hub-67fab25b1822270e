<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Command Center">
<meta name="theme-color" content="#302F2F">
<meta name="robots" content="noindex, nofollow">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#302F2F; --white:#fff; --berry:#A31F61; --gold:#CC9F53;
  --paper:#FAF8F5; --line:#E4DED8; --muted:#7A7370;
  --berry-soft:#FBE6EF; --gold-soft:#F8EFDD; --green:#2F6B41; --green-soft:#E6F2E9;
  --sidebar:240px; --radius:10px; --berry-deep:#8A1A53;
  --metal:#3A3939; --hair:rgba(255,255,255,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--ink)}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Nunito Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:400; line-height:1.5; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
a{color:var(--berry)}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh}

/* ---------- SIDEBAR: Linear chrome, machined not flat ---------- */
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);color:#fff;
  padding:22px 14px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, #3c3b3b 0%, var(--ink) 42px, #2a2929 100%);
  border-right:1px solid rgba(204,159,83,.22);
  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.14),
    inset 0 1px 0 rgba(255,255,255,.18),
    inset -1px 0 0 rgba(0,0,0,.45),
    1px 0 0 rgba(0,0,0,.35);
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px;margin:0 2px 2px;
  border-bottom:1px solid var(--hair);
  box-shadow:0 1px 0 rgba(0,0,0,.28)}
.brand-mark{
  width:30px;height:30px;border-radius:8px;color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.06em;
  flex:0 0 auto;
  background:linear-gradient(180deg, #B52672 0%, var(--berry) 46%, var(--berry-deep) 100%);
  box-shadow:
    0 0 0 1px rgba(204,159,83,.42),
    inset 0 1px 0 rgba(255,255,255,.32),
    inset 0 -1px 0 rgba(0,0,0,.28);
}
.brand-name{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;line-height:1.2}
.brand-sub{font-size:10.5px;color:rgba(255,255,255,.38);letter-spacing:.02em;margin-top:3px;font-weight:400}

.modeswitch{
  display:flex;margin:16px 4px 18px;padding:2px;gap:0;border-radius:8px;
  background:rgba(0,0,0,.28);
  box-shadow:inset 0 0 0 1px var(--hair), inset 0 1px 0 rgba(0,0,0,.35);
}
.modeswitch button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.46);
  padding:7px 6px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase}
.modeswitch button.on{
  background:linear-gradient(180deg, #B52672, var(--berry) 55%, var(--berry-deep));
  color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 1px 0 rgba(0,0,0,.25);
}

.navlist{list-style:none;margin:0;padding:0 2px;flex:1}
.navlist li{margin-bottom:2px}
.navlist button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;
  color:rgba(255,255,255,.58);padding:8px 10px;border-radius:7px;font-size:13.5px;
  font-weight:400;text-align:left}
.navlist button:hover{background:rgba(255,255,255,.045);color:rgba(255,255,255,.92)}
.navlist button.on{
  background:linear-gradient(180deg, #3d3c3c, #323131);
  color:#fff;font-weight:600;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    inset 0 -1px 0 rgba(0,0,0,.4),
    inset 2px 0 0 var(--berry);
}
.navlist .ico{width:16px;text-align:center;font-size:12px;flex:0 0 auto;opacity:.7;letter-spacing:0}
.navlist button.on .ico{opacity:1}
.navlist .badge{margin-left:auto;background:transparent;color:var(--gold);font-size:10px;
  font-weight:800;border-radius:99px;padding:1px 0;min-width:16px;text-align:right;
  box-shadow:none}
.navlist button.on .badge{background:transparent;color:var(--gold)}

.sidefoot{margin-top:auto;padding:14px 8px 2px;border-top:1px solid var(--hair);
  box-shadow:0 -1px 0 rgba(0,0,0,.28);
  font-size:11px;color:rgba(255,255,255,.34);line-height:1.5}
.sidefoot + .sidefoot,.sidefoot .footline + .footline{margin-top:8px}

/* ---------- MAIN: one focused work surface ---------- */
.main{flex:1;min-width:0;padding:32px 48px 88px}
.workhead{max-width:860px;padding-bottom:22px;margin-bottom:8px;
  border-bottom:1px solid var(--line)}
.crumb{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px}
.worktop{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.workhead h1{margin:0;font-size:30px;font-weight:300;letter-spacing:-.025em;line-height:1.15}
.workhead h1 b{font-weight:800}
.workhead .date{color:var(--muted);font-size:13px;margin-top:8px;letter-spacing:.01em;max-width:62ch;line-height:1.45}
.brief{
  background:transparent;color:var(--muted);border:0;border-radius:0;
  padding:6px 0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;margin-top:4px}
.brief:hover{color:var(--berry)}

.askbar{margin-top:20px}
.askbar .k{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.askrow{display:flex;gap:10px;align-items:center}
.askrow input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);border-radius:0;
  padding:10px 0;font-family:inherit;font-size:16px;background:transparent;color:var(--ink)}
.askrow input:focus{outline:none;border-bottom-color:var(--ink)}
.askrow button{border:0;background:transparent;color:var(--ink);border-radius:0;padding:8px 0;
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:0 0 auto}
.askrow button:hover{color:var(--berry)}
.asknote{font-size:12.5px;color:var(--muted);margin-top:0;min-height:0;line-height:1.45}
.asknote.show{margin-top:8px}
.asknote.bad{color:var(--berry)}
.asknote.ok{color:var(--green)}
.hudsonask{
  margin:12px 0 6px;padding:12px 14px 14px 16px;max-width:560px;
  background:var(--gold-soft);
  border-left:3px solid var(--gold);
}
.hudsonask-k{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 8px;letter-spacing:.01em}
.hudsonask-row{display:flex;gap:8px;align-items:stretch;flex-wrap:nowrap}
.hudsonask-row input{
  flex:1 1 auto;min-width:0;min-height:44px;
  border:1px solid var(--ink);background:#fff;color:var(--ink);
  padding:10px 12px;font-family:inherit;font-size:16px;border-radius:0}
.hudsonask-row input:focus{outline:none;border-color:var(--ink)}
.hudsonask .act{
  flex:0 0 auto;border:1.5px solid var(--berry);background:var(--berry);color:#fff;
  border-radius:8px;padding:10px 16px;min-height:44px;min-width:72px;font-size:13px;font-weight:700}
.hudsonask-x{margin-top:8px;min-height:44px}
.hudsonask .act:hover{background:var(--berry-deep);border-color:var(--berry-deep);color:#fff}
.hudsonask .act.quiet{background:#fff;color:var(--ink);border-color:var(--line)}
.hudsonask .act.quiet:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.after .hudsonask .act{padding:8px 16px;font-size:12.5px;border-width:1.5px;border-radius:8px}
.after .hudsonask .act:not(.quiet){background:var(--berry);color:#fff;border-color:var(--berry)}
.after .hudsonask .act:not(.quiet):hover{background:var(--berry-deep);border-color:var(--berry-deep);color:#fff}
.hudsonask-note{display:none;margin-top:8px;font-size:13px;font-weight:600;line-height:1.4;color:var(--ink)}
.hudsonask-note.show{display:block}
.hudsonask-note.bad{color:var(--berry)}
.hudsonask-note.ok{color:var(--green)}
.hudson-rownote{background:var(--green-soft);color:var(--green);padding:9px 13px;
  font-size:13px;font-weight:600;margin:9px 0 2px;display:none}
.hudson-rownote.bad{background:var(--berry-soft);color:var(--berry)}
.hudson-rownote.show{display:block}

.grid{display:flex;flex-direction:column;gap:0;max-width:860px;align-items:stretch}
.stage{padding:36px 0 8px}
.after{padding:28px 0 0;margin-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:0}
.quietpair{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.utility{padding:28px 0 0;margin-top:8px;border-top:1px solid var(--line);opacity:.88}

.card{background:transparent;border:0;border-radius:0;padding:20px 0 22px;
  border-bottom:1px solid var(--line)}
.card.wide{grid-column:auto}
.card h2{margin:0 0 14px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);border-bottom:0;padding-bottom:0;
  display:flex;align-items:center;gap:10px;justify-content:space-between}
.card h2 .rt{font-size:11px;letter-spacing:.02em;color:var(--muted);font-weight:600;text-transform:none}
.card h2 .kicker{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--berry);margin-bottom:8px}
.card ul{margin:0;padding-left:18px}
.card li{margin-bottom:10px}
.card li:last-child{margin-bottom:0}
.big{font-weight:600}
.note{color:var(--muted);font-size:13px;margin-top:12px}
.sub{display:block;color:var(--muted);font-size:12.5px}

.row{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .time{min-width:92px;font-weight:600;font-size:13px}
.row .what{flex:1}

.tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;font-weight:700;vertical-align:middle}
.t-hot{background:var(--berry-soft);color:var(--berry)}
.t-money{background:var(--gold-soft);color:#8A6420}
.t-old{background:#F0EEED;color:var(--muted)}
.t-ok{background:var(--green-soft);color:var(--green)}
.t-dead{background:#EFE9EE;color:#6D0F3F}
code{background:#F2EFED;padding:1px 5px;border-radius:4px;font-size:12px}

/* The one loud surface. Everything else stays quiet. */
.card.focus{padding:4px 0 8px;border-bottom:0}
.card.focus h2{
  display:block;color:var(--ink);font-size:32px;line-height:1.18;font-weight:700;
  letter-spacing:-.03em;text-transform:none;margin:0 0 20px}
.card.focus h2 .kicker{margin-bottom:12px;font-size:10.5px}
.card.focus h2 .rt{display:none}
.card.focus .card-body{font-size:16.5px;line-height:1.55;max-width:58ch}
.card.focus .acts{margin-top:22px}
.card.focus .act:not(.quiet){background:var(--berry);color:#fff;border-color:var(--berry);padding:11px 18px}
.card.focus .act:not(.quiet):hover{background:var(--berry-deep);border-color:var(--berry-deep)}
.card.focus .top3{padding:16px 2px}
.card.focus .top3 input{font-size:20px;padding:8px 2px}
.card.hero{position:relative;padding:8px 0 28px;border-bottom:0}
.card.hero > h2{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.after .card{font-size:14px;padding:18px 0}
.after .card h2{font-size:10px;letter-spacing:.16em;margin-bottom:12px}
.after .acts{margin-top:8px}
.after .act{padding:5px 10px;font-size:11px;letter-spacing:.02em;border-width:1px;border-radius:6px}
.after .act:not(.quiet){border-color:var(--line);color:var(--ink);background:transparent}
.after .act:not(.quiet):hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.card.handled{padding:18px 0}
.card.handled .zero{text-align:left;padding:0;color:var(--muted)}
.siren{background:transparent;color:var(--ink);border:0;padding:8px 0 32px}
.siren h2{color:var(--ink);border:0}
.siren code{background:#F2EFED;color:var(--ink)}
.alarm{background:transparent;border:0}
.days{font-weight:700;color:var(--berry)}
.card.quiet h2,.after > .card h2{color:var(--muted)}

/* ---------- 6G ---------- */
.homehero{display:grid;grid-template-columns:auto 1fr;gap:18px 22px;align-items:start}
.homeunit{
  width:64px;height:64px;border-radius:10px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:800;letter-spacing:.04em;font-size:14px;
  box-shadow:
    0 0 0 1px rgba(204,159,83,.45),
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 -1px 0 rgba(0,0,0,.35);
}
.homekicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
.homename{font-size:26px;font-weight:700;margin:4px 0 8px;letter-spacing:-.025em;line-height:1.15}
.weekrow{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.weekrow:last-child{border-bottom:none}
.weekrow .when{font-weight:700;font-size:13px;letter-spacing:.01em}
.weekrow .when span{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}
.weekrow .what strong{display:block;font-weight:700;margin-bottom:3px}
.standing{display:inline-block;margin-top:6px}

/* ---------- CHECKLISTS ---------- */
.chk{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:none}
.chk .box{width:22px;height:22px;flex:0 0 auto;border:2px solid var(--line);border-radius:7px;
  display:grid;place-items:center;font-size:13px;color:transparent;transition:.16s;margin-top:1px}
.chk.done .box{background:var(--berry);border-color:var(--berry);color:#fff}
.chk .lbl{flex:1;line-height:1.45}
.chk.done .lbl{color:var(--muted);text-decoration:line-through}
.chk .mins{font-size:11.5px;color:var(--muted);font-weight:600;flex:0 0 auto;margin-top:3px}

.bar{height:7px;background:#EFEBE9;border-radius:99px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--berry);border-radius:99px;transition:width .35s ease}
.bar.gold i{background:var(--gold)}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:#8A6420;
  border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700}

.zonehead{background:var(--ink);color:#fff;border-radius:10px;padding:20px 22px;margin:20px 0 8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), inset 0 -1px 0 rgba(0,0,0,.35)}
.zonehead .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.zonehead .z{font-size:22px;font-weight:700;margin:5px 0 3px;line-height:1.25}
.zonehead .r{font-size:13px;color:rgba(255,255,255,.62)}
.zonepips{display:flex;gap:6px;margin-top:14px}
.zonepips span{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.18)}
.zonepips span.on{background:var(--gold)}

.wide{display:block}
.hotspot{background:transparent;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.hotspot .h{font-weight:700;color:var(--berry);font-size:14px;margin-bottom:5px}
.timer{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;color:var(--berry);letter-spacing:.02em}
.tbtn{border:1px solid var(--berry);background:#fff;color:var(--berry);border-radius:8px;
  padding:7px 15px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-right:7px}
.tbtn:hover{background:var(--berry);color:#fff}

/* ---------- BRAIN DUMP / FORMS ---------- */
.dumpbox{display:flex;gap:9px;margin-bottom:16px}
.dumpbox input,.findform input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;
  padding:13px 15px;font-family:inherit;font-size:15.5px;background:#fff;color:var(--ink)}
.dumpbox input:focus,.findform input:focus{outline:none;border-color:var(--berry)}
.dumpbox button,.findform button{border:0;background:var(--berry);color:#fff;border-radius:10px;
  padding:0 20px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto}
.findform{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.findform input{min-width:150px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;
  padding:5px 13px;font-size:12px;font-weight:600;letter-spacing:.03em}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.item{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .circ{width:21px;height:21px;flex:0 0 auto;border:2px solid var(--line);border-radius:50%;cursor:pointer;margin-top:2px}
.item .circ:hover{border-color:var(--berry)}
.item .txt{flex:1;line-height:1.45}
.bkt{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;border-radius:99px;
  padding:2px 8px;cursor:pointer;border:0;flex:0 0 auto;margin-top:2px}
.b-errand{background:var(--gold-soft);color:#8A6420}
.b-family{background:var(--berry-soft);color:var(--berry)}
.b-money{background:var(--green-soft);color:var(--green)}
.b-someday{background:#EEF0F4;color:#4A5568}
.b-sort{background:#F0EEED;color:var(--muted)}
.age{font-size:11.5px;color:var(--muted);font-weight:600}

.top3{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.top3:last-child{border-bottom:none}
.top3 .n{width:25px;height:25px;flex:0 0 auto;border-radius:8px;background:var(--berry-soft);color:var(--berry);
  display:grid;place-items:center;font-weight:700;font-size:12.5px}
.top3 input{flex:1;min-width:0;border:0;border-bottom:1px dashed transparent;background:transparent;
  font-family:inherit;font-size:15.5px;color:var(--ink);padding:4px 2px}
.top3 input:focus{outline:none;border-bottom-color:var(--berry)}
.top3.done input{color:var(--muted);text-decoration:line-through}
.top3 .box{width:22px;height:22px;flex:0 0 auto;border:2px solid var(--line);border-radius:7px;
  display:grid;place-items:center;font-size:13px;color:transparent;cursor:pointer}
.top3.done .box{background:var(--berry);border-color:var(--berry);color:#fff}

.qc{display:flex;gap:10px;flex-wrap:wrap}
.qcbtn{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px 15px;
  font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.qcbtn.on{border-color:var(--berry);background:var(--berry-soft);color:var(--berry)}
.qcbtn .cnt{background:var(--berry);color:#fff;border-radius:99px;padding:1px 8px;font-size:11.5px}

.zero{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center;line-height:1.6}

/* ---------- ACTION BUTTONS ---------- */
.acts{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 2px}
.act{border:1.5px solid var(--berry);background:#fff;color:var(--berry);border-radius:8px;
  padding:7px 14px;font-size:12.5px;font-weight:700;letter-spacing:.03em;transition:.15s}
.act:hover{background:var(--berry);color:#fff}
.act.quiet{border-color:var(--line);color:var(--muted)}
.act.quiet:hover{background:var(--muted);color:#fff;border-color:var(--muted)}
.act[disabled]{opacity:.5;pointer-events:none}
.itemdone{opacity:.45}
.itemdone .big{text-decoration:line-through}
.flash{background:var(--green-soft);color:var(--green);border-radius:8px;padding:9px 13px;
  font-size:13px;font-weight:600;margin:9px 0 2px;display:none}
.flash.bad{background:var(--berry-soft);color:var(--berry)}
.flash.show{display:block}

.connect{background:transparent;border:0}
.connect h2{color:var(--muted);border:0}
.connect input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-family:inherit;font-size:14px;margin-bottom:8px;background:#fff}

<script>
"use strict";

/* =====================================================================
   STORAGE. Phase 1 is device local. Phase 2 swaps this for a shared
   store so the phone and the Mac agree. Everything else stays put.
   ===================================================================== */
const DB = (() => {
  const KEY = "cc_v2";
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { d = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };
  return {
    get: (k, fb) => (k in d ? d[k] : fb),
    set: (k, v) => { d[k] = v; save(); },
    all: () => d
  };
})();

/* =====================================================================
   RELAY. Talks to the Apps Script backend. Until it is connected the board
   still works, it just remembers things on this device only.
   ===================================================================== */
const CFG = {
  get url()    { return DB.get("cfg_url", ""); },
  get secret() { return DB.get("cfg_secret", ""); },
  get on()     { return !!(this.url && this.secret); }
};
/* Hudson is a separate webhook. These keys must never reuse cfg_url / cfg_secret. */
const HUDSON = {
  urlKey: "hudson_webhook_url",
  keyKey: "hudson_sender_key",
  asksKey: "hudson_asks",
  get url() { try { return localStorage.getItem(this.urlKey) || ""; } catch (e) { return ""; } },
  get key() { try { return localStorage.getItem(this.keyKey) || ""; } catch (e) { return ""; } },
  get on()  { return !!(this.url && this.key); },
  set(url, key) {
    try {
      if (url) localStorage.setItem(this.urlKey, url); else localStorage.removeItem(this.urlKey);
      if (key) localStorage.setItem(this.keyKey, key); else localStorage.removeItem(this.keyKey);
    } catch (e) {}
  },
  clear() { this.set("", ""); },
  loadAsks() {
    try { return JSON.parse(localStorage.getItem(this.asksKey) || "[]"); } catch (e) { return []; }
  },
  saveAsk(entry) {
    const asks = this.loadAsks();
    asks.unshift(entry);
    try {
      localStorage.setItem(this.asksKey, JSON.stringify(asks.slice(0, 40)));
      return true;
    } catch (e) {
      return false;
    }
  }
};
const HUDSON_RELAY = "https://sc-hudson-relay.vercel.app/api/hudson";
const HUDSON_CTX = {};
let syncing = false;

function hudsonRelayBody(fields) {
  const body = {
    text: fields.text || "",
    source: fields.source || "",
    card: fields.card || "",
    action: fields.action || "",
    itemId: fields.itemId || "",
    mode: fields.mode != null ? fields.mode : mode,
    page: fields.page != null ? fields.page : page,
    at: fields.at || new Date().toISOString()
  };
  if (HUDSON.url && HUDSON.key) {
    body.webhook = HUDSON.url;
    body.key = HUDSON.key;
  }
  return body;
}
async function postHudsonRelay(fields) {
  return fetch(HUDSON_RELAY, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(hudsonRelayBody(fields))
  });
}

async function relay(payload) {
  if (!CFG.on) return { ok: false, error: "not connected" };
  try {
    const r = await fetch(CFG.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids the CORS preflight Apps Script cannot answer
      body: JSON.stringify(Object.assign({ secret: CFG.secret }, payload))
    });
    return await r.json();
  } catch (e) {
    return { ok: false, error: String(e) };
  }
}
async function pushState() {
  if (!CFG.on || syncing) return;
  await relay({ op: "saveState", state: DB.all() });
}
async function pullState() {
  if (!CFG.on) return false;
  try {
    const r = await fetch(CFG.url + "?secret=" + encodeURIComponent(CFG.secret));
    const j = await r.json();
    if (j.ok && j.state) {
      syncing = true;
      Object.keys(j.state).forEach(k => { if (!k.startsWith("cfg_")) DB.set(k, j.state[k]); });
      syncing = false;
      return true;
    }
  } catch (e) {}
  return false;
}

function plainText(html) {
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}
function rememberHudson(id, title, text) {
  HUDSON_CTX[id] = { title: title || "", text: plainText(text || "") };
}
function hudsonAct(id, title, text) {
  rememberHudson(id, title, text);
  return `<div class="acts"><button type="button" class="act" data-hudson="${id}">Ask Hudson</button></div>
    <div class="flash" id="flash-${id}"></div>`;
}
function taskReplyActs(id) {
  return `<button type="button" class="act quiet" data-carlitos="${id}">Need a change</button>` +
    `<button type="button" class="act quiet" data-hudson="${id}">Ask Hudson</button>`;
}
function askNote(msg, kind) {
  const n = el("#asknote");
  if (!n) return;
  n.textContent = msg || "";
  n.className = "asknote" + (msg ? " show" : "") + (kind === "bad" ? " bad" : kind === "ok" ? " ok" : "");
}
function hudsonCardText(id) {
  const ctx = HUDSON_CTX[id] || { title: "", text: "" };
  const title = (ctx.title || "").trim();
  const text = (ctx.text || "").trim();
  if (!title) return text;
  if (!text || text === title || text.indexOf(title) === 0) return text || title;
  return title + ". " + text;
}
function closeHudsonAsk() {
  const box = view.querySelector("#hudsonask");
  if (box) box.remove();
}
function hudsonAskHost(btn, id) {
  const li = btn.closest("li");
  if (li) return li;
  const acts = btn.closest(".acts");
  if (acts && acts.parentElement) return acts.parentElement;
  const flashEl = id ? view.querySelector("#flash-" + id) : null;
  if (flashEl && flashEl.parentElement) return flashEl.parentElement;
  return acts || btn.parentElement;
}
function hudsonAskNote(msg, kind) {
  const n = view.querySelector("#hudsonasknote");
  if (!n) return;
  n.textContent = msg || "";
  n.className = "hudsonask-note" + (msg ? " show" : "") + (kind === "bad" ? " bad" : kind === "ok" ? " ok" : "");
}
function rowHudsonNote(id, host, msg, bad) {
  const flashEl = id ? view.querySelector("#flash-" + id) : null;
  if (flashEl) {
    flash(id, msg, bad);
    return;
  }
  if (!host) return;
  let note = host.querySelector(":scope > .hudson-rownote");
  if (!note) {
    note = document.createElement("div");
    note.className = "hudson-rownote";
    host.appendChild(note);
  }
  note.textContent = msg || "";
  note.className = "hudson-rownote" + (msg ? " show" : "") + (bad ? " bad" : "");
}
function openHudsonAsk(btn) {
  const id = btn.dataset.hudson;
  const existing = view.querySelector("#hudsonask");
  if (existing && existing.dataset.for === id) {
    existing.remove();
    return;
  }
  if (existing) existing.remove();
  closeCarlitosAsk();
  const host = hudsonAskHost(btn, id);
  const box = document.createElement("div");
  box.id = "hudsonask";
  box.className = "hudsonask";
  box.dataset.for = id;
  box.innerHTML =
    `<div class="hudsonask-k">Ask Hudson about this</div>` +
    `<div class="hudsonask-row">` +
      `<input id="hudsonaskin" type="text" placeholder="What do you want to know about this?" autocomplete="off" enterkeyhint="send">` +
      `<button type="button" class="act" id="hudsonasksend">Send</button>` +
    `</div>` +
    `<button type="button" class="act quiet hudsonask-x" id="hudsonaskcancel">Cancel</button>` +
    `<div class="hudsonask-note" id="hudsonasknote"></div>`;
  if (host) host.appendChild(box);
  else btn.insertAdjacentElement("afterend", box);
  const inp = box.querySelector("#hudsonaskin");
  const send = () => {
    const text = inp.value.trim();
    if (!text) {
      hudsonAskNote("Type a question first.", "bad");
      return;
    }
    hudsonAskNote("");
    askHudson({
      text,
      source: "card",
      card: hudsonCardText(id),
      flashId: id,
      host
    }).then(result => {
      if (result === "sent") {
        closeHudsonAsk();
        rowHudsonNote(id, host, "Sent.", false);
      } else if (result === "saved") {
        closeHudsonAsk();
        rowHudsonNote(id, host, "Saved. I'll take it from here.", false);
      } else {
        hudsonAskNote("Hudson is not connected on this device.", "bad");
      }
    });
  };
  box.querySelector("#hudsonasksend").onclick = send;
  box.querySelector("#hudsonaskcancel").onclick = closeHudsonAsk;
  inp.onkeydown = e => { if (e.key === "Enter") send(); };
  inp.focus();
}
async function askHudson(opts) {
  const text = (opts.text || "").trim();
  const card = opts.card || "";
  const flashId = opts.flashId || "";
  if (!text) return false;
  const payload = {
    text,
    source: opts.source || "bar",
    card,
    action: opts.action || "",
    itemId: opts.itemId || "",
    mode,
    page,
    at: new Date().toISOString(),
    day: todayKey()
  };
  const saved = HUDSON.saveAsk(payload);
  const tell = (msg, kind) => {
    askNote(msg, kind);
    if (flashId) flash(flashId, msg, kind === "bad");
    else if (opts.host) rowHudsonNote("", opts.host, msg, kind === "bad");
  };
  try {
    const r = await postHudsonRelay(payload);
    if (r.ok) {
      tell("Sent.", "ok");
      return "sent";
    }
    if (saved) {
      tell("Saved. I'll take it from here.", "ok");
      return "saved";
    }
    tell("Hudson is not connected on this device.", "bad");
    return false;
  } catch (e) {
    if (saved) {
      tell("Saved. I'll take it from here.", "ok");
      return "saved";
    }
    tell("Hudson is not connected on this device.", "bad");
    return false;
  }
}

function closeCarlitosAsk() {
  const box = view.querySelector("#carlitosask");
  if (box) box.remove();
}
function carlitosAskNote(msg, kind) {
  const n = view.querySelector("#carlitosasknote");
  if (!n) return;
  n.textContent = msg || "";
  n.className = "hudsonask-note" + (msg ? " show" : "") + (kind === "bad" ? " bad" : kind === "ok" ? " ok" : "");
}
function openCarlitosAsk(btn) {
  const id = btn.dataset.carlitos;
  const existing = view.querySelector("#carlitosask");
  if (existing && existing.dataset.for === id) {
    existing.remove();
    return;
  }
  if (existing) existing.remove();
  closeHudsonAsk();
  const host = hudsonAskHost(btn, id);
  const box = document.createElement("div");
  box.id = "carlitosask";
  box.className = "hudsonask";
  box.dataset.for = id;
  box.innerHTML =
    `<div class="hudsonask-k">Tell Carlitos</div>` +
    `<div class="hudsonask-row">` +
      `<input id="carlitosaskin" type="text" placeholder="What should change?" autocomplete="off" enterkeyhint="send">` +
      `<button type="button" class="act" id="carlitosasksend">Send</button>` +
    `</div>` +
    `<button type="button" class="act quiet hudsonask-x" id="carlitosaskcancel">Cancel</button>` +
    `<div class="hudsonask-note" id="carlitosasknote"></div>`;
  if (host) host.appendChild(box);
  else btn.insertAdjacentElement("afterend", box);
  const inp = box.querySelector("#carlitosaskin");
  const send = () => {
    const text = inp.value.trim();
    if (!text) {
      carlitosAskNote("Type a note first.", "bad");
      return;
    }
    carlitosAskNote("");
    sendCarlitosTask({
      text,
      action: "change",
      itemId: id,
      card: hudsonCardText(id)
    }).then(result => {
      if (result === "sent") {
        closeCarlitosAsk();
        rowHudsonNote(id, host, "Sent.", false);
      } else if (result === "saved") {
        closeCarlitosAsk();
        rowHudsonNote(id, host, "Saved. I'll take it from here.", false);
      } else {
        carlitosAskNote("Hudson is not connected on this device.", "bad");
      }
    });
  };
  box.querySelector("#carlitosasksend").onclick = send;
  box.querySelector("#carlitosaskcancel").onclick = closeCarlitosAsk;
  inp.onkeydown = e => { if (e.key === "Enter") send(); };
  inp.focus();
}
async function sendCarlitosTask(opts) {
  const text = (opts.text || "").trim();
  const itemId = opts.itemId || "";
  const card = opts.card || hudsonCardText(itemId);
  if (!text) return false;
  const payload = {
    text,
    source: "carlitos-task",
    action: opts.action || "",
    card,
    itemId,
    mode,
    page,
    at: new Date().toISOString(),
    day: todayKey()
  };
  const saved = HUDSON.saveAsk(payload);
  try {
    const r = await postHudsonRelay(payload);
    if (r.ok) return "sent";
    return saved ? "saved" : false;
  } catch (e) {
    return saved ? "saved" : false;
  }
}

/* item-level board state: done, snoozed, dropped */
function itemKey(itemOrId) {
  if (itemOrId && typeof itemOrId === "object") return itemOrId.stateId || itemOrId.id;
  const item = ACT_INDEX[itemOrId];
  return (item && item.stateId) || itemOrId;
}
function itemState(id) { return DB.get("item_" + itemKey(id), null); }
function setItemState(id, v) { DB.set("item_" + itemKey(id), v); pushState(); }

/* ---------- dates, always America/Chicago ---------- */
function todayKey() {
  return new Date().toLocaleDateString("en-CA", { timeZone: "America/Chicago" });
}
function nowParts() {
  const label = new Date().toLocaleDateString("en-US", {
    timeZone: "America/Chicago", weekday: "long", month: "long",
    day: "numeric", year: "numeric"
  });
  const hour = parseInt(new Date().toLocaleString("en-US",
    { timeZone: "America/Chicago", hour: "2-digit", hour12: false }), 10);
  return { label, hour };
}
function chicagoDate() {
  const p = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit", weekday: "short"
  }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { y: +g("year"), m: +g("month"), d: +g("day"), wd: g("weekday") };
}
/* daily reset: any date-stamped bucket resets when the stamp is stale */
function daily(key, fallback) {
  const rec = DB.get(key, null);
  if (!rec || rec.day !== todayKey()) return JSON.parse(JSON.stringify(fallback));
  return rec.val;
}
function setDaily(key, val) { DB.set(key, { day: todayKey(), val }); }

/* =====================================================================
   FLYLADY. Zones are decluttering zones, not deep cleaning zones,
   because the maid comes twice a week. See the note on the FlyLady view.
   ===================================================================== */
const ZONES = [
  { n: 1, name: "Entryway", rooms: "Entryway",
    tasks: ["Clear the drop zone. Keys, mail, bags off every surface",
            "Shoes back where they belong",
            "Sort the mail pile. Recycle, act, file. Nothing goes back on the table",
            "Wipe the door handles and light switches",
            "Anything that lives in another room, walk it there now"] },
  { n: 2, name: "Kitchen and Living Room", rooms: "Kitchen, living room",
    tasks: ["Counters to zero. Everything gets a home",
            "One drawer or one cabinet, purged",
            "Fridge sweep. Expired out, leftovers gone",
            "Living room surfaces cleared. Coffee table, side tables, console",
            "Cords, remotes, chargers back in their spot",
            "Return the water glasses. All of them"] },
  { n: 3, name: "Master Bedroom and Bath", rooms: "Master bedroom, master bathroom",
    tasks: ["Nightstands cleared to the essentials",
            "The chair. You know the one. Empty it",
            "Bathroom counter to zero",
            "Purge one drawer of products you will never use again",
            "Under the sink, one bin sorted",
            "Anything on the floor that is not furniture, off the floor"] },
  { n: 4, name: "The Closets", rooms: "Master closet, Larry's closet",
    tasks: ["27 fling boogie in your closet. Twenty seven things out, no debating",
            "Everything on the floor hung, folded, or gone",
            "One shelf reset",
            "Shoes paired and lined up",
            "Ask Larry before touching his closet, then do the same passes",
            "Donate bag to the car tonight, not next week"] },
  { n: 5, name: "Guest Rooms", rooms: "Guest bedroom, guest bathroom, third bedroom",
    tasks: ["Clear whatever has been dumped in here since last month",
            "Guest bath restocked. Soap, towels, paper",
            "Surfaces to zero so it is guest ready on no notice",
            "One box or bin actually dealt with, not moved",
            "Close the door on a room you would not mind someone opening"] }
];

/* Zone 1 runs day 1 to the first Saturday. Zones 2, 3, 4 are the full
   weeks after it. Zone 5 is the tail of the month. */
function currentZone() {
  const { y, m, d } = chicagoDate();
  const firstDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(); // 0 Sun ... 6 Sat
  const firstSat = 1 + ((6 - firstDow + 7) % 7);
  if (d <= firstSat) return ZONES[0];
  const wk = Math.ceil((d - firstSat) / 7); // 1,2,3,4,5
  return ZONES[Math.min(wk, 4)];
}

const MORNING = [
  { id: "m1", t: "Get dressed to shoes", min: 5 },
  { id: "m2", t: "Make the bed", min: 2 },
  { id: "m3", t: "Swish and swipe the bathroom", min: 2 },
  { id: "m4", t: "Kitchen launch. Sink empty, counters clear", min: 3 },
  { id: "m5", t: "Look at today's schedule", min: 2 },
  { id: "m6", t: "Start a load of laundry", min: 2 },
  { id: "m7", t: "Pick your Top 3", min: 3 }
];
const EVENING = [
  { id: "e1", t: "Kitchen reset. Counters, dishwasher, shine the sink", min: 5 },
  { id: "e2", t: "Ten minute pickup. Everything to its room", min: 10 },
  { id: "e3", t: "Clear the entryway drop zone", min: 2 },
  { id: "e4", t: "Lay out tomorrow's outfit", min: 3 },
  { id: "e5", t: "Camera bag and gear ready if there is a shoot", min: 4 },
  { id: "e6", t: "Phone on the charger, not the bed", min: 1 }
];

function guessBucket(s) {
  const t = s.toLowerCase();
  if (/\b(pay|bill|invoice|money|bank|tax|refund|deposit|budget|insur|rent|ach|venmo|zelle)\b/.test(t)) return "money";
  if (/\b(larry|claire|courtney|mom|dad|sister|family|dinner|birthday|anniversar|kid|dog)\b/.test(t)) return "family";
  if (/\b(buy|pick up|drop off|store|target|costco|hobby|pharmacy|prescription|order|return|mail|ship|schedule|appointment|call|book)\b/.test(t)) return "errand";
  if (/\b(someday|maybe|would be nice|one day|eventually|think about|look into)\b/.test(t)) return "someday";
  return "sort later";
}
function daysOld(iso) {
  const a = new Date(iso), b = new Date();
  return Math.floor((b - a) / 86400000);
}

function card(title, bodyHTML, opts) {
  opts = opts || {};
  const wide = opts.wide ? " wide" : "";
  const extra = opts.cls ? " " + opts.cls : "";
  const coll = opts.collapsed ? " collapsible" : "";
  const rt = opts.right ? `<span class="rt">${opts.right}</span>` : "";

/* renders a list whose entries carry action buttons */
function ulActs(arr, title) {
  const live = arr.filter(i => {
    const s = itemState(i);
    if (!s) return true;
    if (s.k === "drop" || s.k === "done") return false;
    if (s.k === "snooze") return s.until <= todayKey();
    return true;
  });
  if (!live.length) return `<div class="zero">All of these are handled.<br>Rare. Enjoy it.</div>`;
  return "<ul>" + live.map(i => {
    rememberHudson(i.id, title || "", i.html);
    const acts = (i.act || []).map((a, n) =>
      `<button class="act${a.k === "done" || a.k === "drop" || a.k === "snooze" ? " quiet" : ""}"
        data-act="${i.id}" data-n="${n}">${a.label}</button>`).join("")
      + taskReplyActs(i.id);
    return `<li>${i.html}
      <div class="acts">${acts}</div>
      <div class="flash" id="flash-${i.id}"></div></li>`;
  }).join("") + "</ul>";
}
function hiddenCount(arr) {
  return arr.length - arr.filter(i => !itemState(i) || itemState(i).k === "snooze" && itemState(i).until <= todayKey()).length;
}

function routineCard(key, title, tasks, goldBar, flag) {
  const st = daily("r_" + key, {});
  const done = tasks.filter(t => st[t.id]).length;
  const pct = Math.round(done / tasks.length * 100);
  const streak = DB.get("streak_" + key, 0);
  const rows = tasks.map(t =>
    `<div class="chk${st[t.id] ? " done" : ""}" data-rt="${key}" data-id="${t.id}">
       <div class="box">✓</div><div class="lbl">${t.t}</div><div class="mins">${t.min} min</div>
     </div>`).join("");
  let right = streak > 0 ? `<span class="streak">✦ ${streak} day${streak === 1 ? "" : "s"}</span>` : `${done} of ${tasks.length}`;
  if (flag) right = `<span class="tag t-hot">${flag}</span> ` + right;
  return card(title, `<div class="bar${goldBar ? " gold" : ""}"><i style="width:${pct}%"></i></div>${rows}`, { right });
}

let dumpFilter = null;
function dumpView() {
  const items = DB.get("dumps", []);
  const open = items.filter(i => !i.done);
  const shown = dumpFilter ? open.filter(i => i.b === dumpFilter) : open;
  const resurf = open.filter(i => daysOld(i.at) >= 5).slice(0, 3);

  const box = `<div class="dumpbox">
      <input id="dumpin" placeholder="What is in your head right now" autocomplete="off">
      <button id="dumpbtn">Dump</button>
    </div>`;
  const chips = `<div class="chips">
      <button data-f="" class="${dumpFilter ? "" : "on"}">All ${open.length}</button>
      ${BUCKETS.map(b => {
        const n = open.filter(i => i.b === b).length;
        return `<button data-f="${b}" class="${dumpFilter === b ? "on" : ""}">${b} ${n}</button>`;
      }).join("")}
    </div>`;
  const rows = shown.length
    ? shown.map(i => `<div class="item">
        <div class="circ" data-done="${i.id}"></div>
        <div class="txt">${i.t}</div>
        <button class="bkt ${BCLASS[i.b]}" data-cycle="${i.id}">${i.b}</button>
      </div>`).join("")
    : `<div class="zero">Nothing in here.<br>Either you are on top of everything, or it is all still in your head.</div>`;

  const resurfCard = resurf.length
    ? card("Resurfaced", resurf.map(i => `<div class="item">
        <div class="circ" data-done="${i.id}"></div>
        <div class="txt">${i.t} <span class="age">from ${daysOld(i.at)} days ago</span></div>
        <button class="bkt ${BCLASS[i.b]}" data-cycle="${i.id}">${i.b}</button>
      </div>`).join(""), { wide: true, right: "you do not have to go looking" })
    : "";

  return `<div class="after">${card("Brain dump", box + chips + rows, { wide: true, right: `${open.length} open` })}${resurfCard}</div>`;
}

  const p = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit", weekday: "short"
  }).formatToParts(dt);
  const g = t => p.find(x => x.type === t).value;
  const long = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Chicago", weekday: "long", month: "short", day: "numeric"
  }).format(dt);
  return { y: +g("year"), m: +g("month"), d: +g("day"), wd: g("weekday"), key: `${g("year")}-${g("month")}-${g("day")}`, long };
}

/* Dated building invites only. Standing brunch is generated. Golf stays off. */
const SIXG_INVITES = [];

function chicagoMinutes() {
  const p = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Chicago", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
  }).formatToParts(new Date());
  const g = t => +p.find(x => x.type === t).value;
  return g("hour") * 60 + g("minute");
}

function sixGWeek() {
  const events = [];
  const nowMin = chicagoMinutes();
  for (let i = 0; i <= 7; i++) {
    const day = chicagoPlus(i);
    const brunchEnded = i === 0 && day.wd === "Sun" && nowMin >= 13 * 60;
    if (day.wd === "Sun" && !brunchEnded) {
      events.push({
        key: day.key + "-brunch",
        when: day.long,
        time: "11 to 1",
        title: "Brunch Club",
        where: "Piano Lounge",
        standing: true,
        note: "Same hours every Sunday."
      });
    }
    SIXG_INVITES.forEach(inv => {
      if (inv.date === day.key) events.push({ ...inv, when: day.long });
    });
  }
  return events;
}

function sixGView() {
  const week = sixGWeek();
  const notes = DB.get("sixg_locker", []);
  const homeHtml = `<div class="homehero">
      <div class="homeunit">5316</div>

        <div class="homekicker">Residences at 6G</div>
        <div class="homename">Unit 5316</div>
        <p style="margin:0;max-width:46ch">October 3 is held as move-in until they change it. Probably sooner. Nothing to send from here.</p>
      </div>
    </div>`;
  const home = card("Home",
    homeHtml + hudsonAct("sixg-home", "Home", "Residences at 6G / Unit 5316. October 3 is held as move-in until they change it."),
    { wide: true, cls: "hero" });

  const weekRows = week.length
    ? week.map(e => `<div class="weekrow">
        <div class="when">${e.when}<span>${e.time}</span></div>
        <div class="what"><strong>${e.title}</strong>${e.where}${e.standing ? ` <span class="tag t-ok standing">Standing</span>` : ""}<span class="sub">${e.note || ""}</span></div>
      </div>`).join("")
    : `<div class="zero">Quiet week at the building.<br>Sunday brunch will return when the next Sunday lands in this window.</div>`;

  const weekBody = weekRows + `<div class="note">Dated building events only, a week out. Sunday brunch is standing.</div>`;
  const weekCard = card("This week at 6G",
    weekBody + hudsonAct("sixg-week", "This week at 6G", weekBody),
    { wide: true, cls: "quiet", right: week.length ? `${week.length} this week` : "clear" });

  const lockerRows = notes.length
    ? notes.map(n => `<div class="item">
        <div class="circ" data-lockdel="${n.id}"></div>
        <div class="txt">${n.t}<span class="sub">${n.at}</span></div>
        <button class="bkt b-sort" data-lockdel="${n.id}">clear</button>
      </div>`).join("")
    : `<div class="zero">Nothing waiting. If a locker code or package note lands, park it here.</div>`;

  const locker = card("Packages and locker",
    `<div class="dumpbox">
      <input id="lockerin" placeholder="Locker code, hold, or who it is for" autocomplete="off">
      <button id="lockerbtn">Keep</button>
    </div>` + lockerRows + hudsonAct("sixg-locker", "Packages and locker", lockerRows),
    { wide: true, cls: "quiet", right: notes.length ? `${notes.length} held` : "" });

  return `<div class="stage">${home}</div><div class="after">${weekCard}${locker}</div>`;
}

const PERSVIEWS = { today: todayView, flylady: flyladyView, dump: dumpView, findit: findView, sixg: sixGView };

/* =====================================================================
   RENDER
   ===================================================================== */
function renderNav() {
  el("#nav").innerHTML = NAV[mode].map(n =>
    `<li><button data-page="${n.id}" class="${n.id === page ? "on" : ""}">
      <span class="ico">${n.ico}</span>${n.label}
      ${n.badge ? `<span class="badge">${n.badge}</span>` : ""}
    </button></li>`).join("");
  el("#monav").innerHTML = NAV[mode].map(n =>
    `<button data-page="${n.id}" class="${n.id === page ? "on" : ""}">
      <span class="ico">${n.ico}</span>${n.label}
    </button>`).join("");
  document.querySelectorAll(".modeswitch button, .mtop button").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === mode));
}
function renderGreet() {
  const p = nowParts();
  const word = p.hour < 12 ? "Good morning" : p.hour < 17 ? "Good afternoon" : "Good evening";
  const navItem = NAV[mode].find(n => n.id === page) || NAV[mode][0];
  const crumb = el("#crumb");
  if (crumb) crumb.textContent = "Command Center / " + (mode === "business" ? "Business" : "Personal") + " / " + navItem.label;
  el("#greetline").innerHTML = `${word}, <b>Suzanne</b>`;
  el("#greetdate").textContent = p.label + (mode === "business"
    ? " · " + BIZ.stamp
    : page === "sixg"
      ? " · Residences at 6G, unit 5316"
      : " · Zone " + currentZone().n + ", " + currentZone().name);
  const hudson = HUDSON.on
    ? `<div class="footline"><span class="dot on"></span>Hudson is connected.</div>`
    : `<div class="footline"><span class="dot off"></span>This phone can check off and send notes. Hudson connect is optional.</div>`;
  el("#sidefoot").innerHTML = hudson;
  const askin = el("#askin");
  if (askin && document.activeElement !== askin) {
    askin.placeholder = mode === "business"
      ? "Ask Hudson"
      : page === "sixg"
        ? "Ask about 6G"
        : "Ask Hudson";
  }
}
function render() {
  const views = mode === "business" ? BIZVIEWS : PERSVIEWS;
  if (!views[page]) page = NAV[mode][0].id;
  renderNav(); renderGreet();
  view.innerHTML = views[page]();
  view.querySelectorAll(".collapsible").forEach(c => { if (window.innerWidth > 860) c.classList.add("open"); });
  wire();
  window.scrollTo({ top: 0 });
}

/* =====================================================================
   INTERACTION
   ===================================================================== */
document.addEventListener("click", e => {
  const m = e.target.closest("[data-mode]");
  if (m) {
    mode = m.dataset.mode; DB.set("mode", mode);
    page = DB.get("page_" + mode, NAV[mode][0].id);
    if (!NAV[mode].some(n => n.id === page)) page = NAV[mode][0].id;
    render(); return;
  }
  const p = e.target.closest("[data-page]");
  if (p) { page = p.dataset.page; DB.set("page_" + mode, page); render(); return; }
});

function flash(id, msg, bad) {
  const n = view.querySelector("#flash-" + id);
  if (!n) return;
  n.textContent = msg;
  n.className = "flash show" + (bad ? " bad" : "");
}

const ACT_INDEX = {};
BIZ.then.concat(BIZ.waiting).forEach(i => ACT_INDEX[i.id] = i);

async function doAction(itemId, n) {
  const item = ACT_INDEX[itemId];
  if (!item) return;
  const a = item.act[n];

  /* hide first from this device; relay is best-effort and must not block */
  if (a.k === "done") {
    const cardText = hudsonCardText(itemId);
    setItemState(itemId, { k: "done", at: todayKey() });
    render();
    askNote("Cleared.", "ok");
    sendCarlitosTask({
      text: "Marked complete.",
      action: "done",
      itemId,
      card: cardText
    });
    return;
  }
  if (a.k === "drop")   { setItemState(itemId, { k: "drop", at: todayKey() }); render(); return; }
  if (a.k === "snooze") {
    const t = new Date(); t.setDate(t.getDate() + 1);
    setItemState(itemId, { k: "snooze", until: t.toLocaleDateString("en-CA", { timeZone: "America/Chicago" }) });
    render(); return;
  }

  flash(itemId, "This stays on the card. Nothing was sent.");
}

let timerInt = null, tleft = 120;
function wire() {
  /* action buttons */
  view.querySelectorAll("[data-act]").forEach(b =>
    b.onclick = () => doAction(b.dataset.act, +b.dataset.n));

  /* connect card */
  const cs = view.querySelector("#cfgsave");
  if (cs) cs.onclick = async () => {
    const u = view.querySelector("#cfgurl").value.trim();
    const s = view.querySelector("#cfgsecret").value.trim();
    if (!u || !s) { flash("cfg", "Both fields, please.", true); return; }
    DB.set("cfg_url", u); DB.set("cfg_secret", s);
    flash("cfg", "Testing...");
    const ok = await pullState();
    if (ok) { flash("cfg", "Connected."); await pushState(); setTimeout(render, 700); }
    else {
      DB.set("cfg_url", ""); DB.set("cfg_secret", "");
      flash("cfg", "No answer. Check the URL ends in /exec, that access is set to Anyone, and that the secret matches.", true);
    }
  };

  /* Hudson webhook, separate from CFG.url / CFG.secret */
  const hs = view.querySelector("#hudsonsave");
  if (hs) hs.onclick = () => {
    const u = (view.querySelector("#hudsonurl") || {}).value;
    const k = (view.querySelector("#hudsonkey") || {}).value;
    const url = (u || "").trim();
    const key = (k || "").trim();
    if (!url || !key) { flash("hudson", "Both fields, please.", true); return; }
    HUDSON.set(url, key);
    flash("hudson", "Hudson is connected on this device.");
    askNote("Hudson is connected.", "ok");
    setTimeout(render, 500);
  };
  const hc = view.querySelector("#hudsonclear");
  if (hc) hc.onclick = () => {
    HUDSON.clear();
    askNote("Hudson disconnected. This phone can still check off and send notes.", "ok");
    render();
  };

  view.querySelectorAll("[data-carlitos]").forEach(b => b.onclick = () => openCarlitosAsk(b));
  view.querySelectorAll("[data-hudson]").forEach(b => b.onclick = () => openHudsonAsk(b));

  /* collapsible cards on phone */
  view.querySelectorAll(".collapsible h2").forEach(h =>
    h.onclick = () => h.parentElement.classList.toggle("open"));

  /* routine + zone checkboxes */
  view.querySelectorAll("[data-rt]").forEach(r => r.onclick = () => {
    const k = "r_" + r.dataset.rt, st = daily(k, {});
    st[r.dataset.id] = !st[r.dataset.id];
    setDaily(k, st);
    const list = r.dataset.rt === "morning" ? MORNING : r.dataset.rt === "evening" ? EVENING : MAIDPREP;
    if (list.every(t => st[t.id])) {
      const sk = "streak_" + r.dataset.rt, last = DB.get("last_" + r.dataset.rt, null);
      if (last !== todayKey()) { DB.set(sk, DB.get(sk, 0) + 1); DB.set("last_" + r.dataset.rt, todayKey()); }
    }
    render();
  });
  view.querySelectorAll("[data-zone]").forEach(r => r.onclick = () => {
    const k = "zone_" + r.dataset.zone, st = daily(k, {});
    st[r.dataset.i] = !st[r.dataset.i]; setDaily(k, st); render();
  });

  /* hot spot timer */
  const disp = view.querySelector("#tdisp");
  if (disp) {
    const paint = () => disp.textContent =
      String(Math.floor(tleft / 60)).padStart(2, "0") + ":" + String(tleft % 60).padStart(2, "0");
    paint();
    view.querySelector("#tstart").onclick = () => {
      if (timerInt) { clearInterval(timerInt); timerInt = null; view.querySelector("#tstart").textContent = "Start"; return; }
      view.querySelector("#tstart").textContent = "Pause";
      timerInt = setInterval(() => {
        tleft--; paint();
        if (tleft <= 0) { clearInterval(timerInt); timerInt = null; tleft = 120; disp.textContent = "Time"; }
      }, 1000);
    };
    view.querySelector("#treset").onclick = () => { clearInterval(timerInt); timerInt = null; tleft = 120; paint(); view.querySelector("#tstart").textContent = "Start"; };
    view.querySelector("#tdone").onclick = () => { const h = daily("hotspot", { done: false }); setDaily("hotspot", { done: !h.done }); render(); };
  }

  /* 27 fling */
  const fu = view.querySelector("#flingup");
  if (fu) {
    fu.onclick = () => { const f = daily("fling", { n: 0 }); setDaily("fling", { n: Math.min(27, f.n + 1) }); render(); };
    view.querySelector("#flingreset").onclick = () => { setDaily("fling", { n: 0 }); render(); };
  }

  /* top 3 */
  view.querySelectorAll("[data-t3]").forEach(inp => inp.onchange = () => {
    const t3 = daily("top3", [{ t: "", d: false }, { t: "", d: false }, { t: "", d: false }]);
    t3[+inp.dataset.t3].t = inp.value; setDaily("top3", t3);
  });
  view.querySelectorAll("[data-t3d]").forEach(b => b.onclick = () => {
    const t3 = daily("top3", [{ t: "", d: false }, { t: "", d: false }, { t: "", d: false }]);
    const i = +b.dataset.t3d; t3[i].d = !t3[i].d; setDaily("top3", t3); render();
  });

  /* quick checks */
  view.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    const q = daily("quick", { meds: false, water: 0, moved: false });
    const k = b.dataset.q;
    if (k === "water") q.water = (q.water + 1) % 13; else q[k] = !q[k];
    setDaily("quick", q); render();
  });

  /* brain dump */
  const din = view.querySelector("#dumpin");
  if (din) {
    const add = () => {
      const t = din.value.trim(); if (!t) return;
      const items = DB.get("dumps", []);
      items.unshift({ id: "d" + Date.now(), t, b: guessBucket(t), at: new Date().toISOString(), done: false });
      DB.set("dumps", items); din.value = ""; render();
      setTimeout(() => { const n = view.querySelector("#dumpin"); if (n) n.focus(); }, 0);
    };
    view.querySelector("#dumpbtn").onclick = add;
    din.onkeydown = e => { if (e.key === "Enter") add(); };
    din.focus();
  }
  view.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { dumpFilter = b.dataset.f || null; render(); });
  view.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {
    const items = DB.get("dumps", []); const it = items.find(i => i.id === b.dataset.done);
    if (it) it.done = true; DB.set("dumps", items); render();
  });
  view.querySelectorAll("[data-cycle]").forEach(b => b.onclick = () => {
    const items = DB.get("dumps", []); const it = items.find(i => i.id === b.dataset.cycle);
    if (it) it.b = BUCKETS[(BUCKETS.indexOf(it.b) + 1) % BUCKETS.length];
    DB.set("dumps", items); render();
  });

  /* where is it */
  const fs = view.querySelector("#fsearch");
  if (fs) {
    fs.oninput = () => {
      findQ = fs.value;
      const things = DB.get("things", []);
      const q = findQ.toLowerCase();
      const hits = q ? things.filter(t => (t.what + " " + t.where).toLowerCase().includes(q)) : things;
      const holder = fs.closest(".card-body");
      holder.querySelectorAll(".item").forEach(n => n.remove());
      const zero = holder.querySelector(".zero"); if (zero) zero.remove();
      holder.insertAdjacentHTML("beforeend", hits.length
        ? hits.map(t => `<div class="item"><div class="txt"><strong>${t.what}</strong><span class="sub">${t.where}</span></div>
            <button class="bkt b-sort" data-del="${t.id}">remove</button></div>`).join("")
        : `<div class="zero">Nothing matches that.</div>`);
      holder.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
        DB.set("things", DB.get("things", []).filter(x => x.id !== b.dataset.del)); render();
      });
    };
    view.querySelector("#fadd").onclick = () => {
      const w = view.querySelector("#fwhat").value.trim(), r = view.querySelector("#fwhere").value.trim();
      if (!w || !r) return;
      const things = DB.get("things", []);
      things.unshift({ id: "t" + Date.now(), what: w, where: r });
      DB.set("things", things); findQ = ""; render();
    };
  }
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    DB.set("things", DB.get("things", []).filter(x => x.id !== b.dataset.del)); render();
  });
  view.querySelectorAll("[data-wdone]").forEach(b => b.onclick = () => {
    DB.set("waiting", DB.get("waiting", []).filter(w => w.id !== b.dataset.wdone)); render();
  });

  const lin = view.querySelector("#lockerin");
  if (lin) {
    const add = () => {
      const t = lin.value.trim();
      if (!t) return;
      const notes = DB.get("sixg_locker", []);
      notes.unshift({ id: "l" + Date.now(), t, at: chicagoPlus(0).long });
      DB.set("sixg_locker", notes);
      render();
    };
    view.querySelector("#lockerbtn").onclick = add;
    lin.onkeydown = e => { if (e.key === "Enter") add(); };
    lin.focus();
  }
  view.querySelectorAll("[data-lockdel]").forEach(b => b.onclick = () => {
    DB.set("sixg_locker", DB.get("sixg_locker", []).filter(n => n.id !== b.dataset.lockdel));
    render();
  });
}

el("#briefbtn").onclick = () => {
  mode = "business"; page = "overview"; DB.set("mode", mode); DB.set("page_business", page); render();
};

(function wireAskBar() {
  const inp = el("#askin");
  const btn = el("#askbtn");
  if (!inp || !btn) return;
  const send = () => {
    const text = inp.value.trim();
    if (!text) {
      askNote("Type an ask first.", "bad");
      return;
    }
    askHudson({ text, source: "bar", card: "" }).then(result => {
      if (result) inp.value = "";
    });
  };
  btn.onclick = send;
  inp.onkeydown = e => { if (e.key === "Enter") send(); };
})();

/* carry unfinished Top 3 forward */
(function carry() {
  const rec = DB.get("top3", null);
  if (rec && rec.day !== todayKey()) {
    DB.set("top3_carried", rec.val.filter(s => s.t && !s.d).map(s => s.t));
  }
})();

render();

/* pull shared state on load, then keep pushing local changes up */
(async () => {
  if (await pullState()) render();
})();
const _set = DB.set;
window.addEventListener("beforeunload", pushState);
setInterval(pushState, 20000);
</script>
