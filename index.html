<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Command Center">
<meta name="theme-color" content="#302F2F">
<meta name="robots" content="noindex, nofollow">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#302F2F; --white:#fff; --berry:#A31F61; --gold:#CC9F53;
  --paper:#FAF8F5; --line:#E6E0DD; --muted:#7A7370;
  --berry-soft:#FBE6EF; --gold-soft:#F8EFDD; --green:#2F6B41; --green-soft:#E6F2E9;
  --sidebar:268px; --radius:16px; --berry-deep:#8A1A53;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--ink)}
body{
  background:
    radial-gradient(1200px 420px at 72% -8%, rgba(163,31,97,.045), transparent 58%),
    var(--paper);
  color:var(--ink);
  font-family:"Nunito Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:300; line-height:1.55; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
a{color:var(--berry)}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--ink);color:#fff;
  padding:28px 18px 26px;position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:13px;padding:0 8px 22px;margin-bottom:4px;
  border-bottom:1px solid rgba(255,255,255,.1)}
.brand-mark{
  width:42px;height:42px;border-radius:50%;background:var(--berry);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.04em;
  flex:0 0 auto;box-shadow:0 0 0 1.5px rgba(204,159,83,.55), 0 0 0 5px rgba(163,31,97,.18);
}
.brand-name{font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;line-height:1.25}
.brand-sub{font-size:11px;color:rgba(255,255,255,.42);letter-spacing:.03em;margin-top:3px;font-weight:400}

.modeswitch{display:flex;background:rgba(255,255,255,.07);border-radius:999px;padding:3px;margin:18px 4px 22px;gap:0}
.modeswitch button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.55);
  padding:9px 8px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;transition:.18s}
.modeswitch button.on{background:var(--berry);color:#fff}

.navlist{list-style:none;margin:0;padding:0;flex:1}
.navlist li{margin-bottom:4px}
.navlist button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;
  color:rgba(255,255,255,.68);padding:11px 14px;border-radius:11px;font-size:14.5px;
  font-weight:400;text-align:left;transition:.16s}
.navlist button:hover{background:rgba(255,255,255,.06);color:#fff}
.navlist button.on{background:var(--berry);color:#fff;font-weight:700}
.navlist .ico{width:18px;text-align:center;font-size:13px;flex:0 0 auto;opacity:.88;letter-spacing:0}
.navlist .badge{margin-left:auto;background:var(--gold);color:var(--ink);font-size:10px;
  font-weight:800;border-radius:99px;padding:2px 7px;min-width:20px;text-align:center}
.navlist button.on .badge{background:#fff;color:var(--berry)}

.sidefoot{margin-top:auto;padding:16px 12px 0;border-top:1px solid rgba(255,255,255,.1);
  font-size:11.5px;color:rgba(255,255,255,.38);line-height:1.55}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;padding:36px 40px 72px}
.greet{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  padding-bottom:22px;margin-bottom:28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.greet h1{margin:0;font-size:28px;font-weight:300;letter-spacing:-.01em}
.greet h1 b{font-weight:800}
.greet .date{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:.01em}
.brief{background:var(--berry);color:#fff;border:0;border-radius:11px;padding:12px 22px;
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.brief:hover{background:var(--berry-deep)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}
.card.wide{grid-column:1/-1}
.card h2{margin:0 0 16px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--berry);border-bottom:1px solid var(--line);padding-bottom:11px;
  display:flex;align-items:center;gap:9px;justify-content:space-between}
.card h2 .rt{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:600;text-transform:none}
.card ul{margin:0;padding-left:18px}
.card li{margin-bottom:9px}
.card li:last-child{margin-bottom:0}
.big{font-weight:600}
.note{color:var(--muted);font-size:13px;margin-top:11px}
.sub{display:block;color:var(--muted);font-size:12.5px}

.row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .time{min-width:94px;font-weight:600;font-size:13.5px}
.row .what{flex:1}

.tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 8px;border-radius:99px;font-weight:700;vertical-align:middle}
.t-hot{background:var(--berry-soft);color:var(--berry)}
.t-money{background:var(--gold-soft);color:#8A6420}
.t-old{background:#F0EEED;color:var(--muted)}
.t-ok{background:var(--green-soft);color:var(--green)}
.t-dead{background:#EFE9EE;color:#6D0F3F}
code{background:#F2EFED;padding:1px 5px;border-radius:4px;font-size:12px}

.siren{background:var(--berry);color:#fff;border:0;padding:26px 28px}
.siren h2{color:#fff;border-bottom-color:rgba(255,255,255,.22);letter-spacing:.12em}
.siren code{background:rgba(255,255,255,.16);color:#fff}
.siren li{margin-bottom:12px}
.alarm{background:#FFF8FA;border:1px solid #F3D7E4;border-left:5px solid var(--berry)}
.days{font-weight:700;color:var(--berry)}

/* ---------- 6G ---------- */
.homehero{display:grid;grid-template-columns:auto 1fr;gap:18px 22px;align-items:start}
.homeunit{
  width:72px;height:72px;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:800;letter-spacing:.04em;font-size:15px;
  box-shadow:0 0 0 1.5px rgba(204,159,83,.5), 0 0 0 6px rgba(48,47,47,.06);
}
.homekicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
.homename{font-size:22px;font-weight:700;margin:4px 0 6px;letter-spacing:-.015em;line-height:1.2}
.weekrow{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.weekrow:last-child{border-bottom:none}
.weekrow .when{font-weight:700;font-size:13px;letter-spacing:.01em}
.weekrow .when span{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}
.weekrow .what strong{display:block;font-weight:700;margin-bottom:3px}
.standing{display:inline-block;margin-top:6px}

/* ---------- CHECKLISTS ---------- */
.chk{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:none}
.chk .box{width:22px;height:22px;flex:0 0 auto;border:2px solid var(--line);border-radius:7px;
  display:grid;place-items:center;font-size:13px;color:transparent;transition:.16s;margin-top:1px}
.chk.done .box{background:var(--berry);border-color:var(--berry);color:#fff}
.chk .lbl{flex:1;line-height:1.45}
.chk.done .lbl{color:var(--muted);text-decoration:line-through}
.chk .mins{font-size:11.5px;color:var(--muted);font-weight:600;flex:0 0 auto;margin-top:3px}

.bar{height:7px;background:#EFEBE9;border-radius:99px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--berry);border-radius:99px;transition:width .35s ease}
.bar.gold i{background:var(--gold)}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:#8A6420;
  border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700}

.zonehead{grid-column:1/-1;background:var(--ink);color:#fff;border-radius:12px;padding:19px 22px;margin:0}
.zonehead .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.zonehead .z{font-size:22px;font-weight:700;margin:5px 0 3px;line-height:1.25}
.zonehead .r{font-size:13px;color:rgba(255,255,255,.62)}
.zonepips{display:flex;gap:6px;margin-top:14px}
.zonepips span{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.18)}
.zonepips span.on{background:var(--gold)}

.wide{grid-column:1/-1}
.hotspot{background:var(--berry-soft);border:1px solid #F2CFDF;border-radius:12px;padding:17px 20px}
.hotspot .h{font-weight:700;color:var(--berry);font-size:14px;margin-bottom:5px}
.timer{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;color:var(--berry);letter-spacing:.02em}
.tbtn{border:1px solid var(--berry);background:#fff;color:var(--berry);border-radius:8px;
  padding:7px 15px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-right:7px}
.tbtn:hover{background:var(--berry);color:#fff}

/* ---------- BRAIN DUMP / FORMS ---------- */
.dumpbox{display:flex;gap:9px;margin-bottom:16px}
.dumpbox input,.findform input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;
  padding:13px 15px;font-family:inherit;font-size:15.5px;background:#fff;color:var(--ink)}
.dumpbox input:focus,.findform input:focus{outline:none;border-color:var(--berry)}
.dumpbox button,.findform button{border:0;background:var(--berry);color:#fff;border-radius:10px;
  padding:0 20px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto}
.findform{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.findform input{min-width:150px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;
  padding:5px 13px;font-size:12px;font-weight:600;letter-spacing:.03em}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.item{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .circ{width:21px;height:21px;flex:0 0 auto;border:2px solid var(--line);border-radius:50%;cursor:pointer;margin-top:2px}
.item .circ:hover{border-color:var(--berry)}
.item .txt{flex:1;line-height:1.45}
.bkt{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;border-radius:99px;
  padding:2px 8px;cursor:pointer;border:0;flex:0 0 auto;margin-top:2px}
.b-errand{background:var(--gold-soft);color:#8A6420}
.b-family{background:var(--berry-soft);color:var(--berry)}
.b-money{background:var(--green-soft);color:var(--green)}
.b-someday{background:#EEF0F4;color:#4A5568}
.b-sort{background:#F0EEED;color:var(--muted)}
.age{font-size:11.5px;color:var(--muted);font-weight:600}

.top3{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.top3:last-child{border-bottom:none}
.top3 .n{width:25px;height:25px;flex:0 0 auto;border-radius:8px;background:var(--berry-soft);color:var(--berry);
  display:grid;place-items:center;font-weight:700;font-size:12.5px}
.top3 input{flex:1;min-width:0;border:0;border-bottom:1px dashed transparent;background:transparent;
  font-family:inherit;font-size:15.5px;color:var(--ink);padding:4px 2px}
.top3 input:focus{outline:none;border-bottom-color:var(--berry)}
.top3.done input{color:var(--muted);text-decoration:line-through}
.top3 .box{width:22px;height:22px;flex:0 0 auto;border:2px solid var(--line);border-radius:7px;
  display:grid;place-items:center;font-size:13px;color:transparent;cursor:pointer}
.top3.done .box{background:var(--berry);border-color:var(--berry);color:#fff}

.qc{display:flex;gap:10px;flex-wrap:wrap}
.qcbtn{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px 15px;
  font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.qcbtn.on{border-color:var(--berry);background:var(--berry-soft);color:var(--berry)}
.qcbtn .cnt{background:var(--berry);color:#fff;border-radius:99px;padding:1px 8px;font-size:11.5px}

.zero{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center;line-height:1.6}

/* ---------- ACTION BUTTONS ---------- */
.acts{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 2px}
.act{border:1.5px solid var(--berry);background:#fff;color:var(--berry);border-radius:8px;
  padding:7px 14px;font-size:12.5px;font-weight:700;letter-spacing:.03em;transition:.15s}
.act:hover{background:var(--berry);color:#fff}
.act.quiet{border-color:var(--line);color:var(--muted)}
.act.quiet:hover{background:var(--muted);color:#fff;border-color:var(--muted)}
.act[disabled]{opacity:.5;pointer-events:none}
.siren .act{border-color:#fff;color:#fff;background:transparent}
.siren .act:hover{background:#fff;color:var(--berry)}
.itemdone{opacity:.45}
.itemdone .big{text-decoration:line-through}
.flash{background:var(--green-soft);color:var(--green);border-radius:8px;padding:9px 13px;
  font-size:13px;font-weight:600;margin:9px 0 2px;display:none}
.flash.bad{background:var(--berry-soft);color:var(--berry)}
.flash.show{display:block}

.connect{background:var(--gold-soft);border:1px solid #E8D3A8}
.connect h2{color:#8A6420;border-bottom-color:#E8D3A8}
.connect input{width:100%;border:1.5px solid #E0CDA6;border-radius:9px;padding:11px 13px;
  font-family:inherit;font-size:14px;margin-bottom:9px;background:#fff}
.connect input:focus{outline:none;border-color:var(--gold)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:7px}
.dot.on{background:var(--green)}
.dot.off{background:var(--berry)}

/* ---------- MOBILE ---------- */
.mobar{display:none}
@media (max-width:860px){
  body{font-size:15.5px}
  .app{display:block}
  .sidebar{display:none}
  .main{padding:18px 16px 104px}
  .greet{padding-top:8px;margin-bottom:20px}
  .greet h1{font-size:22px}
  .brief{display:none}
  .grid{grid-template-columns:1fr;gap:16px}
  .card{padding:18px 18px}
  .siren{padding:20px 18px}
  .homehero{grid-template-columns:1fr}
  .homeunit{width:58px;height:58px;font-size:13px}
  .mobar{
    display:block;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);
    padding:7px 6px calc(7px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1)}
  .mobar .mrow{display:flex}
  .mobar button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.55);
    padding:7px 1px;font-size:9.5px;font-weight:700;letter-spacing:.02em;
    display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:9px}
  .mobar button .ico{font-size:18px;line-height:1}
  .mobar button.on{color:#fff;background:var(--berry)}
  .mtop{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;gap:3px;margin:0 4px 6px}
  .mtop button{flex:1;flex-direction:row;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px}
  .mtop button.on{background:var(--berry);color:#fff}
  .collapsible .card-body{display:none}
  .collapsible.open .card-body{display:block}
  .collapsible h2{cursor:pointer}
  .collapsible h2:after{content:"+";font-size:17px;color:var(--muted)}
  .collapsible.open h2:after{content:"\2212"}
}
@media (min-width:861px){
  .card-body{display:block !important}
}
</style>
</head>
<body>

<div class="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">SC</div>
      <div>
        <div class="brand-name">Command<br>Center</div>
        <div class="brand-sub">suzannecovert.com</div>
      </div>
    </div>

    <div class="modeswitch">
      <button data-mode="business" class="on">Business</button>
      <button data-mode="personal">Personal</button>
    </div>

    <ul class="navlist" id="nav"></ul>

    <div class="sidefoot" id="sidefoot"></div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">
    <div class="greet">
      <div>
        <h1 id="greetline">Good morning, <b>Suzanne</b></h1>
        <div class="date" id="greetdate"></div>
      </div>
      <button class="brief" id="briefbtn">Daily Briefing</button>
    </div>
    <div class="grid" id="view"></div>
  </main>
</div>

<!-- ================= MOBILE NAV ================= -->
<nav class="mobar">
  <div class="mtop">
    <button data-mode="business" class="on">Business</button>
    <button data-mode="personal">Personal</button>
  </div>
  <div class="mrow" id="monav"></div>
</nav>

<script>
"use strict";

/* =====================================================================
   STORAGE. Phase 1 is device local. Phase 2 swaps this for a shared
   store so the phone and the Mac agree. Everything else stays put.
   ===================================================================== */
const DB = (() => {
  const KEY = "cc_v2";
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { d = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };
  return {
    get: (k, fb) => (k in d ? d[k] : fb),
    set: (k, v) => { d[k] = v; save(); },
    all: () => d
  };
})();

/* =====================================================================
   RELAY. Talks to the Apps Script backend. Until it is connected the board
   still works, it just remembers things on this device only.
   ===================================================================== */
const CFG = {
  get url()    { return DB.get("cfg_url", ""); },
  get secret() { return DB.get("cfg_secret", ""); },
  get on()     { return !!(this.url && this.secret); }
};
let syncing = false;

async function relay(payload) {
  if (!CFG.on) return { ok: false, error: "not connected" };
  try {
    const r = await fetch(CFG.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids the CORS preflight Apps Script cannot answer
      body: JSON.stringify(Object.assign({ secret: CFG.secret }, payload))
    });
    return await r.json();
  } catch (e) {
    return { ok: false, error: String(e) };
  }
}
async function pushState() {
  if (!CFG.on || syncing) return;
  await relay({ op: "saveState", state: DB.all() });
}
async function pullState() {
  if (!CFG.on) return false;
  try {
    const r = await fetch(CFG.url + "?secret=" + encodeURIComponent(CFG.secret));
    const j = await r.json();
    if (j.ok && j.state) {
      syncing = true;
      Object.keys(j.state).forEach(k => { if (!k.startsWith("cfg_")) DB.set(k, j.state[k]); });
      syncing = false;
      return true;
    }
  } catch (e) {}
  return false;
}

/* item-level board state: done, snoozed, dropped */
function itemState(id) { return DB.get("item_" + id, null); }
function setItemState(id, v) { DB.set("item_" + id, v); pushState(); }

/* ---------- dates, always America/Chicago ---------- */
function todayKey() {
  return new Date().toLocaleDateString("en-CA", { timeZone: "America/Chicago" });
}
function nowParts() {
  const label = new Date().toLocaleDateString("en-US", {
    timeZone: "America/Chicago", weekday: "long", month: "long",
    day: "numeric", year: "numeric"
  });
  const hour = parseInt(new Date().toLocaleString("en-US",
    { timeZone: "America/Chicago", hour: "2-digit", hour12: false }), 10);
  return { label, hour };
}
function chicagoDate() {
  const p = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit", weekday: "short"
  }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { y: +g("year"), m: +g("month"), d: +g("day"), wd: g("weekday") };
}
/* daily reset: any date-stamped bucket resets when the stamp is stale */
function daily(key, fallback) {
  const rec = DB.get(key, null);
  if (!rec || rec.day !== todayKey()) return JSON.parse(JSON.stringify(fallback));
  return rec.val;
}
function setDaily(key, val) { DB.set(key, { day: todayKey(), val }); }

/* =====================================================================
   FLYLADY. Zones are decluttering zones, not deep cleaning zones,
   because the maid comes twice a week. See the note on the FlyLady view.

/* Zone 1 runs day 1 to the first Saturday. Zones 2, 3, 4 are the full
   weeks after it. Zone 5 is the tail of the month. */
function currentZone() {
  const { y, m, d } = chicagoDate();
  const firstDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(); // 0 Sun ... 6 Sat
  const firstSat = 1 + ((6 - firstDow + 7) % 7);
  if (d <= firstSat) return ZONES[0];
  const wk = Math.ceil((d - firstSat) / 7); // 1,2,3,4,5
  return ZONES[Math.min(wk, 4)];
}

function guessBucket(s) {
  const t = s.toLowerCase();
  if (/\b(pay|bill|invoice|money|bank|tax|refund|deposit|budget|insur|rent|ach|venmo|zelle)\b/.test(t)) return "money";
  if (/\b(larry|claire|courtney|mom|dad|sister|family|dinner|birthday|anniversar|kid|dog)\b/.test(t)) return "family";
  if (/\b(buy|pick up|drop off|store|target|costco|hobby|pharmacy|prescription|order|return|mail|ship|schedule|appointment|call|book)\b/.test(t)) return "errand";
  if (/\b(someday|maybe|would be nice|one day|eventually|think about|look into)\b/.test(t)) return "someday";
  return "sort later";
}
function daysOld(iso) {
  const a = new Date(iso), b = new Date();
  return Math.floor((b - a) / 86400000);
}

function chicagoPlus(n) {
  const { y, m, d } = chicagoDate();
  const dt = new Date(Date.UTC(y, m - 1, d + n, 17, 0, 0));
  const p = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit", weekday: "short"
  }).formatToParts(dt);
  const g = t => p.find(x => x.type === t).value;
  const long = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Chicago", weekday: "long", month: "short", day: "numeric"
  }).format(dt);
  return { y: +g("year"), m: +g("month"), d: +g("day"), wd: g("weekday"), key: `${g("year")}-${g("month")}-${g("day")}`, long };
}

const ACT_INDEX = {};
[SIREN_ITEM].concat(BIZ.then).forEach(i => ACT_INDEX[i.id] = i);

async function doAction(itemId, n) {
  const item = ACT_INDEX[itemId];
  if (!item) return;
  const a = item.act[n];

  /* local-only verbs resolve instantly, no round trip needed */
  if (a.k === "done")   { setItemState(itemId, { k: "done", at: todayKey() }); render(); return; }
  if (a.k === "drop")   { setItemState(itemId, { k: "drop", at: todayKey() }); render(); return; }
  if (a.k === "snooze") {
    const t = new Date(); t.setDate(t.getDate() + 1);
    setItemState(itemId, { k: "snooze", until: t.toLocaleDateString("en-CA", { timeZone: "America/Chicago" }) });
    render(); return;
  }

  if (!CFG.on) { flash(itemId, "Not connected yet. Fill in the gold card at the top.", true); return; }

  const btns = view.querySelectorAll(`[data-act="${itemId}"]`);
  btns.forEach(b => b.setAttribute("disabled", ""));
  flash(itemId, "Sending...");

  const res = await relay({
    op: "action", kind: a.k, itemId, label: a.label,
    to: a.to, subject: a.subject, text: a.text, title: a.title, notes: a.notes
  });

  btns.forEach(b => b.removeAttribute("disabled"));
  if (res.ok) {
    flash(itemId, res.message || "Done.");
    if (a.k === "draft" || a.k === "note") setItemState(itemId, { k: "sent", at: todayKey(), what: a.label });
  } else {
    flash(itemId, "Did not go through: " + (res.error || "unknown"), true);
  }
}

let timerInt = null, tleft = 120;
function wire() {
  /* action buttons */
  view.querySelectorAll("[data-act]").forEach(b =>
    b.onclick = () => doAction(b.dataset.act, +b.dataset.n));

  /* connect card */
  const cs = view.querySelector("#cfgsave");

    const u = view.querySelector("#cfgurl").value.trim();
    const s = view.querySelector("#cfgsecret").value.trim();
    if (!u || !s) { flash("cfg", "Both fields, please.", true); return; }
    DB.set("cfg_url", u); DB.set("cfg_secret", s);
    flash("cfg", "Testing...");
    const ok = await pullState();
    if (ok) { flash("cfg", "Connected."); await pushState(); setTimeout(render, 700); }
    else {
      DB.set("cfg_url", ""); DB.set("cfg_secret", "");
      flash("cfg", "No answer. Check the URL ends in /exec, that access is set to Anyone, and that the secret matches.", true);
    }

  /* collapsible cards on phone */

    h.onclick = () => h.parentElement.classList.toggle("open"));

  });

  /* hot spot timer */

  if (disp) {
    const paint = () => disp.textContent =
      String(Math.floor(tleft / 60)).padStart(2, "0") + ":" + String(tleft % 60).padStart(2, "0");
    paint();
    view.querySelector("#tstart").onclick = () => {
      if (timerInt) { clearInterval(timerInt); timerInt = null; view.querySelector("#tstart").textContent = "Start"; return; }
      view.querySelector("#tstart").textContent = "Pause";
      timerInt = setInterval(() => {
        tleft--; paint();
        if (tleft <= 0) { clearInterval(timerInt); timerInt = null; tleft = 120; disp.textContent = "Time"; }
      }, 1000);
    };
    view.querySelector("#treset").onclick = () => { clearInterval(timerInt); timerInt = null; tleft = 120; paint(); view.querySelector("#tstart").textContent = "Start"; };
    view.querySelector("#tdone").onclick = () => { const h = daily("hotspot", { done: false }); setDaily("hotspot", { done: !h.done }); render(); };
  }

  /* 27 fling */
  const fu = view.querySelector("#flingup");
  if (fu) {

  });
  view.querySelectorAll("[data-t3d]").forEach(b => b.onclick = () => {

  view.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    const q = daily("quick", { meds: false, water: 0, moved: false });
    const k = b.dataset.q;
    if (k === "water") q.water = (q.water + 1) % 13; else q[k] = !q[k];
    setDaily("quick", q); render();
  });

  /* brain dump */
  const din = view.querySelector("#dumpin");
  if (din) {
    const add = () => {
      const t = din.value.trim(); if (!t) return;
      const items = DB.get("dumps", []);
      items.unshift({ id: "d" + Date.now(), t, b: guessBucket(t), at: new Date().toISOString(), done: false });
      DB.set("dumps", items); din.value = ""; render();
      setTimeout(() => { const n = view.querySelector("#dumpin"); if (n) n.focus(); }, 0);
    };
    view.querySelector("#dumpbtn").onclick = add;
    din.onkeydown = e => { if (e.key === "Enter") add(); };
    din.focus();
  }
  view.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { dumpFilter = b.dataset.f || null; render(); });
  view.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {

    if (it) it.done = true; DB.set("dumps", items); render();
  });
  view.querySelectorAll("[data-cycle]").forEach(b => b.onclick = () => {
    const items = DB.get("dumps", []); const it = items.find(i => i.id === b.dataset.cycle);
    if (it) it.b = BUCKETS[(BUCKETS.indexOf(it.b) + 1) % BUCKETS.length];
    DB.set("dumps", items); render();
  });

  /* where is it */
  const fs = view.querySelector("#fsearch");
  if (fs) {
    fs.oninput = () => {
      findQ = fs.value;
      const things = DB.get("things", []);
      const q = findQ.toLowerCase();
      const hits = q ? things.filter(t => (t.what + " " + t.where).toLowerCase().includes(q)) : things;
      const holder = fs.closest(".card-body");
      holder.querySelectorAll(".item").forEach(n => n.remove());
      const zero = holder.querySelector(".zero"); if (zero) zero.remove();
      holder.insertAdjacentHTML("beforeend", hits.length
        ? hits.map(t => `<div class="item"><div class="txt"><strong>${t.what}</strong><span class="sub">${t.where}</span></div>
            <button class="bkt b-sort" data-del="${t.id}">remove</button></div>`).join("")
        : `<div class="zero">Nothing matches that.</div>`);
      holder.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
        DB.set("things", DB.get("things", []).filter(x => x.id !== b.dataset.del)); render();
      });
    };
    view.querySelector("#fadd").onclick = () => {
      const w = view.querySelector("#fwhat").value.trim(), r = view.querySelector("#fwhere").value.trim();
      if (!w || !r) return;
      const things = DB.get("things", []);
      things.unshift({ id: "t" + Date.now(), what: w, where: r });
      DB.set("things", things); findQ = ""; render();
    };
  }
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    DB.set("things", DB.get("things", []).filter(x => x.id !== b.dataset.del)); render();
  });
  view.querySelectorAll("[data-wdone]").forEach(b => b.onclick = () => {
    DB.set("waiting", DB.get("waiting", []).filter(w => w.id !== b.dataset.wdone)); render();
  });

  const lin = view.querySelector("#lockerin");
  if (lin) {
    const add = () => {
      const t = lin.value.trim();
      if (!t) return;
      const notes = DB.get("sixg_locker", []);
      notes.unshift({ id: "l" + Date.now(), t, at: chicagoPlus(0).long });
      DB.set("sixg_locker", notes);
      render();
    };
    view.querySelector("#lockerbtn").onclick = add;
    lin.onkeydown = e => { if (e.key === "Enter") add(); };
    lin.focus();
  }
  view.querySelectorAll("[data-lockdel]").forEach(b => b.onclick = () => {
    DB.set("sixg_locker", DB.get("sixg_locker", []).filter(n => n.id !== b.dataset.lockdel));
    render();
  });
}

el("#briefbtn").onclick = () => {
  mode = "business"; page = "overview"; DB.set("mode", mode); DB.set("page_business", page); render();
};

/* carry unfinished Top 3 forward */
(function carry() {
  const rec = DB.get("top3", null);
  if (rec && rec.day !== todayKey()) {
    DB.set("top3_carried", rec.val.filter(s => s.t && !s.d).map(s => s.t));
  }
})();

render();

/* pull shared state on load, then keep pushing local changes up */
(async () => {
  if (await pullState()) render();
})();
const _set = DB.set;
window.addEventListener("beforeunload", pushState);
setInterval(pushState, 20000);
</script>
</body>
</html>
